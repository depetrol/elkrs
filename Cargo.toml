[workspace]
resolver = "2"
members = ["crates/elk-graph", "crates/elk-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "EPL-2.0"

[workspace.dependencies]
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
